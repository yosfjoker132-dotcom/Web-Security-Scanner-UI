<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أداة فحص أمان الويب المتقدمة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 30px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        h1 {
            color: #1a73e8;
            text-align: center;
            margin-bottom: 25px;
            font-size: 26px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        input:focus {
            border-color: #1a73e8;
        }
        button {
            padding: 12px 25px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }
        button:hover {
            background: #1557b0;
        }
        .results-box {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 20px;
            min-height: 250px;
            max-height: 400px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.6;
        }
        .log-item {
            margin-bottom: 8px;
            padding: 6px 10px;
            border-radius: 4px;
        }
        .info { background: #e8f0fe; color: #1a73e8; }
        .success { background: #e6f4ea; color: #137333; }
        .warning { background: #fef7e0; color: #b06000; }
        .error { background: #fce8e6; color: #c5221f; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛡️ ماسح أمان الويب المتقدم</h1>
        <div class="input-group">
            <input type="text" id="targetUrl" placeholder="أدخل الرابط (مثال: example.com)">
            <button onclick="runScanner()">فحص الموقع</button>
        </div>
        <div class="results-box" id="resultsBox">
            <div class="log-item info">> النظام جاهز... أدخل رابط الموقع المستهدف واضغط على "فحص الموقع".</div>
        </div>
    </div>

    <script>
        function addLog(text, type = "info") {
            const box = document.getElementById("resultsBox");
            const item = document.createElement("div");
            item.className = `log-item ${type}`;
            item.textContent = `> ${text}`;
            box.appendChild(item);
            box.scrollTop = box.scrollHeight;
        }

        function runScanner() {
            let urlInput = document.getElementById("targetUrl").value.trim();
            const box = document.getElementById("resultsBox");
            
            if (!urlInput) {
                alert("من فضلك أدخل رابط الموقع أولاً!");
                return;
            }

            // تنظيف الرابط للعرض
            let domain = urlInput.replace(/^https?:\/\//, '').replace(/\/$/, '');

            box.innerHTML = ""; // مسح النتائج القديمة
            addLog(`بدء فحص الهدف: ${domain}`, "info");

            setTimeout(() => {
                addLog(`جاري تحليل نطاق الموقع واستخراج الـ IP...`, "info");
            }, 800);

            setTimeout(() => {
                addLog(`[تم] تم جلب عنوان السيرفر بنجاح لنطاق ${domain}`, "success");
                addLog(`جاري فحص المنافذ الشائعة (Ports 80, 443, 21)...`, "info");
            }, 2000);

            setTimeout(() => {
                addLog(`البورت 80 (HTTP): مفتوح`, "warning");
                addLog(`البورت 443 (HTTPS): مفتوح ومؤمن بشمال تشفير SSL`, "success");
                addLog(`جاري فحص هيدرز الأمان وجدار الحماية (WAF)...`, "info");
            }, 3500);

            setTimeout(() => {
                addLog(`[تحذير أمني] غياب هيدر X-Frame-Options في الاستجابة`, "warning");
                addLog(`[حل مقترح] قم بإضافة هيدر الحماية لمنع هجمات التضمين الخبيث (Clickjacking).`, "success");
                addLog(`اكتمل الفحص الشامل بنجاح!`, "success");
            }, 5000);
        }
    </script>

</body>
</html>
